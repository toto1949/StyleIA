name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/server.mjs
          node --check src/config.mjs
          node --check src/routes/generate.mjs
          node --check src/routes/legal.mjs
          node --check src/services/fal-service.mjs
          node --check src/services/prompt-builder.mjs

      - name: Companion prompt regression
        run: npm run test:companions

      - name: Mock API smoke test
        run: npm run test:smoke
        env:
          STYLEAI_JWT_SECRET: ci-test-secret-at-least-32-characters-long

  ios-tests:
    name: iOS unit tests
    runs-on: macos-14
    # Soft-fail: Mac runners / Xcode versions vary across GitHub-hosted images.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Run AuraTests on simulator
        run: |
          set -euo pipefail
          xcodebuild -project Aura.xcodeproj -scheme Aura -showdestinations || true
          xcodebuild test \
            -project Aura.xcodeproj \
            -scheme Aura \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -only-testing:AuraTests \
            CODE_SIGNING_ALLOWED=NO
