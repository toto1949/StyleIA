# Render Blueprint for the SceneMe backend.
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# This production blueprint uses persistent storage. A free instance is not
# suitable because its ephemeral filesystem would erase accounts and uploads.

services:
  - type: web
    # Keep the existing service name/region so the public styleia.onrender.com
    # endpoint remains stable during the production migration.
    name: StyleIA
    runtime: node
    region: virginia
    rootDir: Backend
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sceneme-postgres
          property: connectionPoolString
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      # Signed session tokens; Render generates a strong random value once.
      - key: STYLEAI_JWT_SECRET
        generateValue: true
      - key: STYLEAI_JWT_ISSUER
        value: https://api.sceneme.app
      - key: STYLEAI_JWT_AUDIENCE
        value: com.sceneme.app
      - key: STYLEAI_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: STYLEAI_REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # Your fal.ai API key (dashboard prompts for this on first deploy).
      - key: FAL_KEY
        sync: false
      # Server-side only. Used for text/photo safety and custom scene improvement.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEMPLATE_MODEL
        value: gpt-5-mini
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-latest
      # Must match the iOS app's bundle identifier (Sign in with Apple audience).
      - key: APPLE_CLIENT_ID
        value: com.sceneme.app
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: STYLEAI_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: APP_STORE_ISSUER_ID
        sync: false
      - key: APP_STORE_KEY_ID
        sync: false
      - key: APP_STORE_PRIVATE_KEY
        sync: false
      - key: APP_STORE_BUNDLE_ID
        value: com.sceneme.app
      - key: APP_STORE_APPLE_ID
        sync: false
      # Absolute paths to Apple root CA DER files supplied as Render secret files.
      - key: APP_STORE_ROOT_CA_PATHS
        sync: false
      - key: APP_STORE_ENABLE_ONLINE_CHECKS
        value: "true"
      # Optional: iOS OAuth client ID for Google Sign-In. Leave blank if unused.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Private S3-compatible bucket (AWS S3 or Cloudflare R2). Configure bucket
      # encryption, public-access blocking, lifecycle, versioning and backups in
      # the provider dashboard before the first production deploy.
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "false"
      - key: STYLEAI_MAX_UPLOAD_BYTES
        value: "12000000"
      - key: STYLEAI_MAX_UPLOAD_PIXELS
        value: "40000000"
      - key: STYLEAI_API_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: STYLEAI_USER_RATE_LIMIT_PER_MINUTE
        value: "180"
      - key: STYLEAI_AUTH_RATE_LIMIT_PER_15_MINUTES
        value: "30"
      - key: STYLEAI_APP_STORE_NOTIFICATION_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: STYLEAI_DAILY_USER_BUDGET_USD
        sync: false
      - key: STYLEAI_DAILY_GLOBAL_BUDGET_USD
        sync: false
      - key: STYLEAI_ESTIMATED_IMAGE_COST_USD
        value: "0.04"
      - key: STYLEAI_ESTIMATED_VIDEO_COST_USD
        value: "0.35"

databases:
  - name: sceneme-postgres
    databaseName: sceneme
    user: sceneme_app
    postgresMajorVersion: "18"
    region: virginia
    plan: 0.5c-1g
    connectionPool: pgbouncer
    ipAllowList: []
    storageAutoscalingEnabled: true
